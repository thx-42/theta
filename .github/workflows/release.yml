name: release

on:
  push:
    branches: [main, dev]
    paths-ignore: ["**.md"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: release tag
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = dev ]; then prefix=dev-; channel=dev; else prefix=; channel=stable; fi
          echo "THETA_TAG=${prefix}v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)-${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "THETA_CHANNEL=$channel" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: tar -C target/${{ matrix.target }}/release -czf theta-${{ matrix.target }}.tar.gz theta
      - uses: actions/upload-artifact@v4
        with:
          name: theta-${{ matrix.target }}
          path: theta-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${{ github.ref_name }}" = dev ]; then prefix=dev-; pre=--prerelease; else prefix=; pre=; fi
          tag="${prefix}v${version}-${{ github.run_number }}"
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          gh release create "$tag" dist/* $pre \
            --target "${{ github.sha }}" \
            --title "θ $tag" \
            --generate-notes
