[package]
name = "theta"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
globset = "0.4.20"
html2text = "0.17.1"
ignore = "0.4.33"
pulldown-cmark = "0.13.4"
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "json", "gzip", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.7"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
